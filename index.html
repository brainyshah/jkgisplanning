<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>KML + Geotag KML Viewer</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; }

  #container {
    display: flex;
    height: 100vh;
    width: 100vw;
  }

  /* Left sidebar */
  #sidebar {
    width: 260px;
    background: #f5a623;
    color: #000;
    overflow-y: auto;
  }

  .panel-section {
    border-bottom: 1px solid #e2e2e2;
  }

  .panel-header {
    padding: 8px 10px;
    font-weight: bold;
    background: #f5a623;
  }

  .panel-body {
    background: #fff;
    padding: 8px 10px;
  }

  .panel-body label {
    display: block;
    margin-bottom: 4px;
  }

  .upload-input {
    width: 100%;
  }

  /* Legend styles */
  #kmlLegend,
  #geotagLegend {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 200px;
    overflow-y: auto;
  }

  #kmlLegend li,
  #geotagLegend li {
    display: flex;
    align-items: center;
    margin-bottom: 3px;
    font-size: 13px;
  }

  .legend-color-box {
    width: 14px;
    height: 14px;
    margin-right: 6px;
    border: 1px solid #555;
  }

  /* Map */
  #map {
    flex: 1;
  }
</style>
</head>
<body>

<div id="container">
  <!-- LEFT PANEL -->
  <div id="sidebar">
    <!-- Base Maps -->
    <div class="panel-section">
      <div class="panel-header">Base Maps</div>
      <div class="panel-body" id="basemapPanel">
        <label>
          <input type="radio" name="basemap" value="osm" checked>
          OpenStreetMap
        </label>
        <label>
          <input type="radio" name="basemap" value="gstreet">
          Google Streets
        </label>
        <label>
          <input type="radio" name="basemap" value="gsat">
          Google Satellite
        </label>
        <label>
          <input type="radio" name="basemap" value="dark">
          Dark (Carto)
        </label>
        <label>
          <input type="radio" name="basemap" value="bhuvan_base">
          Bhuvan Imagery (placeholder)
        </label>
        <label>
          <input type="radio" name="basemap" value="bhuvan_lulc">
          Bhuvan LULC 50K (2015‑16)
        </label>
      </div>
    </div>

    <!-- Upload KML -->
    <div class="panel-section">
      <div class="panel-header">Upload KML Files</div>
      <div class="panel-body">
        <input type="file" id="kmlInput" class="upload-input"
               multiple accept=".kml" />
      </div>
    </div>

    <!-- KML Legend -->
    <div class="panel-section">
      <div class="panel-header">KML Layers</div>
      <div class="panel-body">
        <ul id="kmlLegend"></ul>
      </div>
    </div>

    <!-- Upload Geotag KML -->
    <div class="panel-section">
      <div class="panel-header">Upload Geotag Files</div>
      <div class="panel-body">
        <input type="file" id="geotagInput" class="upload-input"
               multiple accept=".kml" />
      </div>
    </div>

    <!-- Geotag legend -->
    <div class="panel-section">
      <div class="panel-header">Geotag Layers</div>
      <div class="panel-body">
        <ul id="geotagLegend"></ul>
      </div>
    </div>
  </div>

  <!-- MAP -->
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

<script>
/* ===============================
   MAP INIT
================================ */
const map = L.map('map', {
  center: [23.5, 80.5],
  zoom: 5,
  preferCanvas: true,
  zoomAnimation: true,
  fadeAnimation: false,
  markerZoomAnimation: false,
  zoomSnap: 0.25,
  zoomDelta: 0.5
});

/* ===============================
   BASEMAPS
================================ */
const baseLayers = {
  osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 20
  }),
  gstreet: L.tileLayer(
    'https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0','mt1','mt2','mt3']
    }
  ),
  gsat: L.tileLayer(
    'https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0','mt1','mt2','mt3']
    }
  ),
  dark: L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 20
    }
  ),
  // placeholder: replace with actual Bhuvan base URL if available
  bhuvan_base: L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 20
    }
  )
};

// Bhuvan LULC (WMS)
const bhuvanLULC = L.tileLayer.wms(
  'https://bhuvan-vec2.nrsc.gov.in/bhuvan/wms',
  {
    layers: 'lulc:JK_LULC50K_1516',
    format: 'image/png',
    transparent: true,
    version: '1.1.1'
  }
);
baseLayers.bhuvan_lulc = bhuvanLULC;

// Default basemap
baseLayers.osm.addTo(map);
let currentBase = baseLayers.osm;

// Base-map radio change
document.getElementById('basemapPanel').addEventListener('change', e => {
  if (e.target.name === 'basemap') {
    const val = e.target.value;
    if (baseLayers[val] && baseLayers[val] !== currentBase) {
      map.removeLayer(currentBase);
      currentBase = baseLayers[val];
      currentBase.addTo(map);
    }
  }
});

/* ===============================
   COMMON HELPERS
================================ */
function randomColor() {
  return `hsl(${Math.random() * 360}, 70%, 50%)`;
}

/* ===============================
   KML HANDLING (main KMLs)
================================ */
const kmlGroup = L.featureGroup().addTo(map);
const kmlLegendList = document.getElementById('kmlLegend');

function addKmlLegendEntry(fileName, color) {
  const li = document.createElement('li');
  const box = document.createElement('span');
  box.className = 'legend-color-box';
  box.style.backgroundColor = color;
  li.appendChild(box);
  li.appendChild(document.createTextNode(fileName));
  kmlLegendList.appendChild(li);
}

function loadKML(file) {
  const url = URL.createObjectURL(file);
  const color = randomColor();

  const layer = L.geoJSON(null, {
    renderer: L.canvas(),
    style: () => ({
      color: color,
      weight: 2,
      fillOpacity: 0.4
    }),
    pointToLayer: (f, latlng) =>
      L.circleMarker(latlng, {
        radius: 5,
        color: color,
        fillOpacity: 0.9
      }),
    onEachFeature: function (feature, lyr) {
      const html = `
        <div style="display:flex;align-items:center;">
          <span style="
            width:14px;height:14px;
            border:1px solid #555;
            background:${color};
            margin-right:6px;
          "></span>
          <span>${file.name}</span>
        </div>`;
      lyr.on('click', e2 => {
        L.popup()
          .setLatLng(e2.latlng)
          .setContent(html)
          .openOn(map);
      });
    }
  });

  omnivore.kml(url, null, layer)
    .on('ready', function () {
      kmlGroup.addLayer(this);
      map.fitBounds(kmlGroup.getBounds(), {
        padding: [30, 30],
        animate: true
      });
      addKmlLegendEntry(file.name, color);
      URL.revokeObjectURL(url);
    })
    .on('error', () => {
      alert('Failed to load ' + file.name);
      URL.revokeObjectURL(url);
    });
}

document.getElementById('kmlInput').addEventListener('change', e => {
  [...e.target.files].forEach(loadKML);
});

/* ===============================
   GEOTAG KML HANDLING
================================ */
/* ===============================
   GEOTAG KML HANDLING (red pins)
================================ */
const geotagGroup = L.featureGroup().addTo(map);
const geotagLegendList = document.getElementById('geotagLegend');

function addGeotagLegendEntry(fileName) {
  const li = document.createElement('li');
  const box = document.createElement('span');
  box.className = 'legend-color-box';
  box.style.backgroundColor = '#ff0000';
  li.appendChild(box);
  li.appendChild(document.createTextNode(fileName));
  geotagLegendList.appendChild(li);
}

function loadGeotagKML(file) {
  const url = URL.createObjectURL(file);

  // 🔴 local red pin icon (same folder as index.html)
  const redPin = L.icon({
    iconUrl: 'red.png',          // <‑‑ relative path, NOT D:\...
    iconSize:   [25, 41],        // set to your PNG size
    iconAnchor: [12, 41],
    popupAnchor:[1, -34],
    shadowUrl:  'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    shadowSize: [41, 41]
  });

  const layer = L.geoJSON(null, {
    renderer: L.canvas(),
    style: () => ({
      color: '#ff0000',
      weight: 2,
      fillOpacity: 0
    }),
    pointToLayer: (feature, latlng) =>
      L.marker(latlng, { icon: redPin }),
    onEachFeature: function (feature, lyr) {
      const html = `
        <div style="display:flex;align-items:center;">
          <span style="
            width:14px;height:14px;
            border:1px solid #555;
            background:#ff0000;
            margin-right:6px;
          "></span>
          <span>${file.name}</span>
        </div>`;
      lyr.on('click', e2 => {
        L.popup()
          .setLatLng(e2.latlng)
          .setContent(html)
          .openOn(map);
      });
    }
  });

  omnivore.kml(url, null, layer)
    .on('ready', function () {
      geotagGroup.addLayer(this);
      map.fitBounds(geotagGroup.getBounds(), {
        padding: [30, 30],
        animate: true
      });
      addGeotagLegendEntry(file.name, '#ff0000');
      URL.revokeObjectURL(url);
    })
    .on('error', () => {
      alert('Failed to load geotag KML: ' + file.name);
      URL.revokeObjectURL(url);
    });
}

document.getElementById('geotagInput').addEventListener('change', e => {
  [...e.target.files].forEach(loadGeotagKML);
});


</script>

</body>
</html>
